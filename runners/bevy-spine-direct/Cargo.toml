[package]
name = "bench-bevy-spine-direct"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "bench-bevy-spine-direct"
path = "src/main.rs"

[dependencies]
bench-core = { path = "../bench-core" }
bevy_spine = { git = "https://github.com/mirsella/bevy_spine", rev = "edcd1ae0f4dc9e0951ec33f96f02e195bd3a64e6" }
bevy = { version = "=0.19.0", default-features = false, features = ["2d"] }

[workspace]

[profile.release]
opt-level = 3
lto = "thin"
debug = 1
