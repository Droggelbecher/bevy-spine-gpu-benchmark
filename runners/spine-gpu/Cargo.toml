[package]
name = "bench-spine-gpu"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Spine benchmark runner for the bevy_spine_gpu crate (Bevy 0.14)"

[[bin]]
name = "bench-spine-gpu"
path = "src/main.rs"

[dependencies]
bench-core = { path = "../bench-core" }
bevy_spine_gpu = { path = "vendor/bevy-spine-gpu" }
bevy = "0.14"

# Standalone workspace (Bevy 0.14); the vendored crate is a member through the path dependency.
[workspace]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
debug = 1
