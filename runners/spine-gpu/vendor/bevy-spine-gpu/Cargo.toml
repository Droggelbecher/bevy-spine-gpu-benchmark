[package]
name = "bevy_spine_gpu"
version = "0.1.0"
edition = "2024"
description = "GPU-driven Spine2D renderer for Bevy 0.14: vertex pulling, packed instance buffers, one instanced draw per skeleton type"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false
# The art is not under the crate's license (see COPYRIGHT): never package it
exclude = ["assets/"]

[dependencies]
bevy = { version = "0.14", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_render",
    "bevy_sprite",
    "png",
] }
anyhow = "1.0"
bytemuck = { version = "1.23", features = ["min_const_generics"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.13"

[dev-dependencies]
# The oracle tests compare against the official runtime (spine-c)
rusty_spine = "0.8"
rand = "0.9"
# Examples open a window
bevy = { version = "0.14", default-features = false, features = [
    "bevy_winit",
    "multi_threaded",
    "x11",
] }

[lints.clippy]
type_complexity = "allow"
